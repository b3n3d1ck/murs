[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murs"
version = "1.0.0"
description = "Matrix Upload Research Suite — authorized web upload security research"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.0"]

[project.scripts]
murs = "murs.cli:main"

[tool.setuptools]
packages = ["murs", "murs.lab"]

[tool.setuptools.package-data]
murs = ["wordlists/*.txt", "lab/vuln/*.php", "lab/patched/*.php",
        "lab/sqli_vuln/*.php", "lab/sqli_patched/*.php"]
